packages:
  darwin:
    taps:
      base:
        - laishulu/homebrew
        - manaflow-ai/cmux
        - nikitabobko/tap
    brews:
      base:
        - laishulu/homebrew/macism # 日本語入力切替（im-select.nvim 用）
        - poppler # rga依存: PDF検索用（pdftotext）
        - ffmpeg # rga依存: メディアファイル検索用
        - vips # 画像処理ライブラリ（CLI + libvips）
    casks:
      base:
        - ghostty # ターミナル
        - manaflow-ai/cmux/cmux # AI コーディングエージェント向け macOS ターミナル
        - nikitabobko/tap/aerospace # タイリングウィンドウマネージャ
        - macvim
        - obsidian
        - claude
        - codex-app
        - thebrowsercompany-dia
        # Ubuntu VM を立てる CLI。単体バイナリの配布が無く（GitHub リリースは .pkg / .msi のみ、
        # Linux は snap）、multipassd を LaunchDaemon として登録する pkg なので mise / aqua では扱えない。
        # pkg ベースの cask のため brew install --cask 時に管理者パスワードを聞かれる。
        - multipass

# im-select 設定（macOS のみ）
im_select:
  darwin:
    default_im: "com.apple.keylayout.ABC"
    command: "macism"
