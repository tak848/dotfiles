[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_install = false
experimental = true
lockfile = true
# npm / pipx backend が checksum/URL をサポートしていないため locked は無効化
# checksum があるツール（aqua: 等）は lockfile=true で検証される
locked = false

[env]
# aube (mise の npm backend が内部で使う) の trustPolicy=no-downgrade が
# tinyexec@1.2.2 を ERR_AUBE_TRUST_DOWNGRADE で拒否するため、
# このバージョンだけ exclude する。
# - tinyexec@1.0.2 は GitHub Actions OIDC の trusted publisher で publish
# - tinyexec@1.2.2 (現 latest) はメンテナ個人 publish で provenance attestation のみ
# バージョンピンでの除外なので、1.2.3+ や他パッケージでは no-downgrade ガードが残る。
# 参考: https://github.com/tak848/dotfiles/actions/runs/26555130050
NPM_CONFIG_TRUST_POLICY_EXCLUDE = "tinyexec@1.2.2"

# Azure CLI の tarball は Python を同梱しておらず、libexec/lib/python3.14/site-packages と
# bash ランチャーだけが入っている。ランチャーは Homebrew Cask 配下に置かれていない場合、
# AZ_PYTHON が指す Python 3.14 で `python -sm azure.cli` を実行する作りで、未設定なら即エラー終了する。
# mise の python backend で入れると PATH に python / python3 が生えて誰でも使えてしまうため使わない。
# uv も既定では実行ファイルを ~/.local/bin（uv python dir --bin）に置いて PATH に生やすので、
# azure-cli 専用のディレクトリに閉じ込める。実体を入れるのは tools 側の postinstall。
AZ_PYTHON = '{{ env.XDG_DATA_HOME | default(value=env.HOME ~ "/.local/share") }}/azure-cli/python/python3.14'

[tools]
# ============================================
# ランタイム（core backend）
# ============================================
node = "24.18.1"
pnpm = "11.18.0"
"github:endevco/aube" = "v1.37.0" # 高速な Node.js パッケージマネージャ
go = "1.26.5"

# ============================================
# aqua CLI（github backend）
# ============================================
# mise の aqua backend で問題のあるツール（aws-cli, 1password/cli, gopls）は
# aqua CLI で直接管理する
"github:aquaproj/aqua" = "v2.62.3"

# ============================================
# CLI ツール（aqua backend）
# ============================================
# GitHub CLI
"aqua:cli/cli" = "2.97.0"

# シェル関連
"aqua:junegunn/fzf" = "0.74.2"
"aqua:starship/starship" = "1.26.0"
"aqua:direnv/direnv" = "2.37.1"
# zoxide は aqua CLI で管理（mise lock で checksum 取得不可）

# 検索・ファイル操作
"aqua:twpayne/chezmoi" = "2.71.1"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:phiresky/ripgrep-all" = "0.10.10"
# rga依存: ドキュメント変換（docx, epub, odt等）
"github:jgm/pandoc" = "3.10.1"
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:x-motemen/ghq" = "1.10.1"
"aqua:jesseduffield/lazygit" = "0.63.1"
"aqua:jesseduffield/lazydocker" = "0.25.2"
# Git credential helper（.NET self-contained。tar.gz を全展開し本体+DLL を同居させる。
# symbols 版を除外するため matching_regex で末尾を絞り、createdump 等は filter_bins で隠す）
"github:git-ecosystem/git-credential-manager" = { version = "v2.9.1", matching_regex = '[0-9]\.tar\.gz$', filter_bins = "git-credential-manager" }

# エディタ・ターミナル
"aqua:neovim/neovim" = "0.12.4"
"github:tmux/tmux-builds" = "v3.6a"
"aqua:arl/gitmux" = "0.11.5"

# Python ツール
"aqua:astral-sh/uv" = "0.12.1"

# クラウド・インフラ（aws-cli は aqua CLI で管理）
"aqua:kubernetes/kubectl" = "1.35.0"
"aqua:cloudflare/cloudflared" = "2026.7.3"
# Azure CLI。aqua-registry に Azure/azure-cli の定義が無いため github backend で入れる。
# リリースアセットは macOS 用 tarball と Windows 用 msi/zip だけで Linux 向けが無いので os で絞る。
# matching_regex は x86_64 マシンで -x64.msi / -x64.zip を掴まないための保険。
# tag が azure-cli-<version> 形式なので version_prefix で補い、version 自体は素の semver にする
# （Renovate に extractVersion で追わせるため。renovate.json5 の packageRules を参照）。
# 実行に必要な Python 3.14 は run_onchange_after_15-azure-cli-python.sh.tmpl が入れる。
# mise の postinstall はシステムの PATH で走り mise 管理の uv が使えないため、そちらには置けない。
"github:Azure/azure-cli" = { version = "2.89.0", version_prefix = "azure-cli-", os = ["macos"], matching_regex = "macos" }

# Snowflake CLI（snow）。GitHub リリースには署名（.sig / .pub）しか無く、公式の配布先である
# sfc-repo も macOS は .pkg、Linux は .deb / .rpm だけで、mise の http backend が扱える形式が無い。
# aqua-registry にも定義が無いため、実体である PyPI パッケージを pipx backend で入れる。
# uv が入っていれば mise は内部で uv tool install を使うので pipx 自体は不要。
# Renovate の mise manager は pipx backend を PyPI datasource として追えるので更新も自動で乗る。
#
# uv の python-preference は既定が managed で、uv 管理の Python が無いマシンでは
# システム（Homebrew）の python3 を拾う。Homebrew 側が Python を上げると venv が壊れるため、
# only-managed で uv 管理の Python に固定する（無ければ uv が自前でダウンロードする）。
# PATH に生えるのは snow だけで、venv の python は mise の bin ディレクトリに出ない。
"pipx:snowflake-cli" = { version = "3.24.1", install_env = { UV_PYTHON_PREFERENCE = "only-managed" } }

# 開発ツール
"aqua:bufbuild/buf" = "1.72.0"
"aqua:go-task/task" = "3.52.0"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:theseus-rs/postgresql-binaries" = "18.4.0"

# Jsonnet
"aqua:google/go-jsonnet" = "0.22.0"
"aqua:grafana/jsonnet-language-server" = "0.17.0"

# Claude Code permission gate
"aqua:tak848/ccgate" = "0.10.0"

# Claude Code セッション選択（claude --resume の fzf フロントエンド）
"github:sorafujitani/ccsession" = "v1.1.0"

# Anthropic API CLI
"aqua:anthropics/anthropic-cli" = "1.21.0"

# Language Server
"go:golang.org/x/tools/gopls" = "v0.23.0"
"github:sivchari/gopls-lazy" = "v0.3.0" # gopls を高速化する LSP プロキシ（大規模 Go モノレポ向け）
"aqua:rust-lang/rust-analyzer" = "2025-12-01"
"aqua:tamasfe/taplo" = "0.10.0"

# その他（1password/cli は aqua CLI で管理）
"aqua:temporalio/cli" = "1.8.2"
"aqua:jdx/usage" = "5.0.0"
# Datadog の AI エージェント向け CLI コンパニオン
"aqua:DataDog/pup" = "1.10.1"

# ============================================
# npm グローバルパッケージ
# ============================================
"aqua:anthropics/claude-code" = "2.1.237"
"github:google-antigravity/antigravity-cli" = "1.1.9"     # agy: Gemini CLI の後継
"aqua:openai/codex" = "0.148.0"
"aqua:anomalyco/opencode" = "1.18.14"
# Grok Build CLI (xAI) は http backend で管理（末尾の [tools."http:grok"] を参照）
# Claude Code のハーネスを ChatGPT サブスクの Codex backend に向ける Anthropic 互換プロキシ。claudex から使う
"github:raine/claude-code-proxy" = { version = "v0.1.30", matching_regex = '\.tar\.gz$' }
"npm:ccusage" = "20.0.19"
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"
"npm:@fission-ai/openspec" = "1.7.0"
"npm:defuddle" = "0.19.2"                                  # WebFetch の代替: URL 本文をモデル要約を挟まず clean な Markdown で取得

# ============================================
# Grok Build CLI (xAI のターミナル向けコーディングエージェント)
# ============================================
# aqua-registry の x.ai/cli/grok は GCS 配信の http パッケージで repo_owner/repo_name を持たない。
# mise の aqua backend は lockfile 生成のたびに GitHub のタグ取得を試みて必ず失敗し、対象
# プラットフォームの数だけ警告を出す。Renovate の mise manager も aqua の http パッケージは
# 抽出対象外で更新が効かない。どちらも http backend で URL を直接指定すれば解消する。
# インラインテーブルにすると platforms を書けないため、[tools] の末尾にサブテーブルで置く。
# renovate: datasource=custom.grok-build depName=grok-build
[tools."http:grok"]
version = "1.0.5"
url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}'
bin = "grok"

# windows のアーティファクトだけ .exe が付くため個別に上書きする
[tools."http:grok".platforms]
windows-x64 = { url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe' }
