[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_install = false
experimental = true
lockfile = true
# npm / pipx backend が checksum/URL をサポートしていないため locked は無効化
# checksum があるツール（aqua: 等）は lockfile=true で検証される
locked = false
# python は snowflake-cli を入れるためだけに置いている（[tools] の python のコメントを参照）。
# python 系のコマンドは shim を作らず、shims だけを PATH に入れるシェル（.zprofile の --shims。
# IDE などの非対話シェル）からは見えないようにする。対話シェルの mise activate は bin ディレクトリを
# 丸ごと PATH に足すので、そちらには効かない。名前は完全一致なので、バージョン付きの名前も並べる。
# 漏れは CI（ci.yaml の Verify python is not exposed via shims）で検出する。
shims.exclude = [
  "idle3",
  "idle3.13",
  "pip",
  "pip3",
  "pip3.13",
  "pydoc3",
  "pydoc3.13",
  "python",
  "python3",
  "python3-config",
  "python3.13",
  "python3.13-config",
]

[env]
# aube (mise の npm backend が内部で使う) の trustPolicy=no-downgrade が
# tinyexec@1.2.2 を ERR_AUBE_TRUST_DOWNGRADE で拒否するため、
# このバージョンだけ exclude する。
# - tinyexec@1.0.2 は GitHub Actions OIDC の trusted publisher で publish
# - tinyexec@1.2.2 (現 latest) はメンテナ個人 publish で provenance attestation のみ
# バージョンピンでの除外なので、1.2.3+ や他パッケージでは no-downgrade ガードが残る。
# 参考: https://github.com/tak848/dotfiles/actions/runs/26555130050
NPM_CONFIG_TRUST_POLICY_EXCLUDE = "tinyexec@1.2.2"

# Azure CLI の tarball は Python を同梱しておらず、libexec/lib/python<版>/site-packages と
# bash ランチャーだけが入っている。ランチャーは Homebrew Cask 配下に置かれていない場合、
# AZ_PYTHON が指す Python で `python -sm azure.cli` を実行する作りで、未設定なら即エラー終了する。
# 必要な Python の版は Azure CLI の版で決まる（ランチャー冒頭の PY_VER）。
# run_onchange_after_15-azure-cli-python.sh.tmpl がその版を uv で入れ、版を含まないリンク az-python を
# 張り替えるので、ここはリンクを指す。
AZ_PYTHON = '{{ env.XDG_DATA_HOME | default(value=env.HOME ~ "/.local/share") }}/azure-cli/python/az-python'

[tools]
# ============================================
# lazy tools
# ============================================
# lazy = true のツールは mise install では入らず、そのコマンドを初めて実行したときに入る（aqua の
# `aqua i -l` に当たる）。明示 backend（aqua: / github: / npm: など）では mise の registry にある bin 名を
# 使えないので、初回の実行で入れるきっかけにするコマンド名を lazy_bins に書く。lazy_bins が無いと mise は
# 警告を出すだけで、そのツールは実行しても入らない。漏れと名前の誤りは CI（ci.yaml の Verify lazy tool
# shims）で検出する。
#
# 次のものは lazy にしない。
# - chezmoi の apply で呼ぶもの（apply の途中で入るので lazy にしても得が無い）: chezmoi, aqua, gh, uv,
#   Azure CLI（run_onchange_after_15 が mise where で場所を引く）, pup, task, temporal, jsonnet, go, claude
# - シェルの起動で呼ぶもの: direnv, starship, fzf
# - ほかのプログラムが裏で呼ぶもの: ccgate と jq（Claude Code / Codex の hook）, gh と git-credential-manager
#   （git の credential helper）, CLIProxyAPI（claudex / claudep は起動を 5 秒しか待たない）
# - ほかのツールの実行や install に使うランタイム: node（npm backend のツール）, python（後述）

# ============================================
# ランタイム（core backend）
# ============================================
node = "26.13.0"
pnpm = { version = "12.16.1", lazy = true, lazy_bins = ["pnpm", "pnpx", "pn", "pnx"] }
"github:endevco/aube" = { version = "v2.8.4", lazy = true, lazy_bins = ["aube", "aubr", "aubx"] } # 高速な Node.js パッケージマネージャ
go = "1.27.3"
# snowflake-cli（pipx backend）の install にだけ使う。lockfile revision 2 では pipx / pypi ツールの
# 依存グラフを uv sync で再現し、その Python は mise の config の python（無ければ PATH 上の python）に
# 固定される。install_env の UV_PYTHON_PREFERENCE では変えられないため、mise で python を持つ。
# snowflake-cli が pyyaml==6.0.2（cp314 の wheel が無い）を固定しているので 3.13 に留める。
# shims からは外している（[settings] の shims.exclude）ので、lazy にしても初回の実行で入れる shim が作られない。
python = "3.13.18"

# ============================================
# aqua CLI（github backend）
# ============================================
# mise の aqua backend で問題のあるツール（aws-cli, 1password/cli, gopls）は
# aqua CLI で直接管理する
"github:aquaproj/aqua" = "v2.65.2"

# ============================================
# CLI ツール（aqua backend）
# ============================================
# GitHub CLI
"aqua:cli/cli" = "2.103.3"

# シェル関連
"aqua:junegunn/fzf" = "0.74.5"
"aqua:starship/starship" = "1.27.0"
"aqua:direnv/direnv" = "2.38.2"
# zoxide は aqua CLI で管理（mise lock で checksum 取得不可）

# 検索・ファイル操作
"aqua:twpayne/chezmoi" = "2.73.3"
"aqua:BurntSushi/ripgrep" = { version = "15.2.0", lazy = true, lazy_bins = ["rg"] }
"aqua:phiresky/ripgrep-all" = { version = "0.10.10", lazy = true, lazy_bins = ["rga", "rga-fzf", "rga-fzf-open"] }
# rga依存: ドキュメント変換（docx, epub, odt等）
"github:jgm/pandoc" = { version = "3.13", lazy = true, lazy_bins = ["pandoc", "pandoc-lua", "pandoc-server"] }
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = { version = "4.54.1", lazy = true, lazy_bins = ["yq"] }
"aqua:x-motemen/ghq" = { version = "1.11.2", lazy = true, lazy_bins = ["ghq"] }
"aqua:jesseduffield/lazygit" = { version = "0.66.2", lazy = true, lazy_bins = ["lazygit"] }
"aqua:jesseduffield/lazydocker" = { version = "0.25.2", lazy = true, lazy_bins = ["lazydocker"] }
# Git credential helper（.NET self-contained。tar.gz を全展開し本体+DLL を同居させる。
# symbols 版を除外するため matching_regex で末尾を絞り、createdump 等は filter_bins で隠す）
# Windows 向けは zip しか無く matching_regex に当たらない。mise 2026.10.19 以降の mise lock は当たる asset が
# 無いと失敗するので、os で Windows を外す（os で外したプラットフォームは 2026.10.20 以降の mise lock が解決しない）
"github:git-ecosystem/git-credential-manager" = { version = "v3.0.2", matching_regex = '[0-9]\.tar\.gz$', filter_bins = "git-credential-manager", os = ["linux", "macos"] }

# エディタ・ターミナル
"aqua:neovim/neovim" = { version = "0.12.6", lazy = true, lazy_bins = ["nvim"] }
"github:tmux/tmux-builds" = { version = "v3.6a", lazy = true, lazy_bins = ["tmux"] }
"aqua:arl/gitmux" = { version = "0.11.5", lazy = true, lazy_bins = ["gitmux"] }

# Python ツール
"aqua:astral-sh/uv" = "0.13.6"

# クラウド・インフラ（aws-cli は aqua CLI で管理）
"aqua:kubernetes/kubectl" = { version = "1.35.0", lazy = true, lazy_bins = ["kubectl"] }
"aqua:cloudflare/cloudflared" = { version = "2026.10.5", lazy = true, lazy_bins = ["cloudflared"] }
# Azure CLI。aqua-registry に Azure/azure-cli の定義が無いため github backend で入れる。
# リリースアセットは macOS と Linux の tarball（azure-cli-<version>-{macos,linux}-{arm64,x86_64}.tar.gz）と
# Windows の msi/zip。Windows は os で外し、matching_regex で tarball に絞って、OS とアーキテクチャは
# mise の自動選択に任せる。
# tag が azure-cli-<version> 形式なので version_prefix で補い、version 自体は素の semver にする
# （Renovate に extractVersion で追わせるため。renovate.json5 の packageRules を参照）。
# 実行に必要な Python は run_onchange_after_15-azure-cli-python.sh.tmpl が入れる。
# mise の postinstall はシステムの PATH で走り mise 管理の uv が使えないため、そちらには置けない。
"github:Azure/azure-cli" = { version = "2.91.0", version_prefix = "azure-cli-", os = ["macos", "linux"], matching_regex = "\\.tar\\.gz$" }

# Snowflake CLI（snow）。GitHub リリースには署名（.sig / .pub）しか無く、公式の配布先である
# sfc-repo も macOS は .pkg、Linux は .deb / .rpm だけで、mise の http backend が扱える形式が無い。
# aqua-registry にも定義が無いため、実体である PyPI パッケージを pipx backend で入れる。
# uv が入っていれば mise は内部で uv tool install を使うので pipx 自体は不要。
# Renovate の mise manager は pipx backend を PyPI datasource として追えるので更新も自動で乗る。
#
# lockfile revision 2 では依存グラフ（locks/pipx-snowflake-cli/）を uv sync で再現し、
# Python には mise の python（ランタイムの節）を使う。以前は install_env の
# UV_PYTHON_PREFERENCE=only-managed で uv 管理の Python に寄せていたが、graph install では
# mise が --python でパスを直接渡すので効かない。何も置かないと PATH 上の python（Homebrew 等）を拾う。
"pipx:snowflake-cli" = { version = "3.31.0", lazy = true, lazy_bins = ["snow"] }

# 開発ツール
"aqua:bufbuild/buf" = { version = "1.75.0", lazy = true, lazy_bins = ["buf", "protoc-gen-buf-breaking", "protoc-gen-buf-lint"] }
"aqua:go-task/task" = "3.54.0"
"aqua:golangci/golangci-lint" = { version = "2.15.0", lazy = true, lazy_bins = ["golangci-lint"] }
# lazy_bins に無いコマンドは実行しても入れるきっかけにならないので、実行ファイルを全部並べる
"aqua:theseus-rs/postgresql-binaries" = { version = "18.6.1", lazy = true, lazy_bins = [
  "clusterdb",
  "createdb",
  "createuser",
  "dropdb",
  "dropuser",
  "ecpg",
  "initdb",
  "oid2name",
  "pg_amcheck",
  "pg_archivecleanup",
  "pg_basebackup",
  "pg_checksums",
  "pg_combinebackup",
  "pg_config",
  "pg_controldata",
  "pg_createsubscriber",
  "pg_ctl",
  "pg_dump",
  "pg_dumpall",
  "pg_isready",
  "pg_receivewal",
  "pg_recvlogical",
  "pg_resetwal",
  "pg_restore",
  "pg_rewind",
  "pg_test_fsync",
  "pg_test_timing",
  "pg_upgrade",
  "pg_verifybackup",
  "pg_waldump",
  "pg_walsummary",
  "pgbench",
  "postgres",
  "psql",
  "reindexdb",
  "vacuumdb",
  "vacuumlo",
] }

# Jsonnet
"aqua:google/go-jsonnet" = "0.22.0"
"aqua:grafana/jsonnet-language-server" = { version = "0.17.0", lazy = true, lazy_bins = ["jsonnet-language-server"] }

# Claude Code permission gate
"aqua:tak848/ccgate" = "0.11.1"

# Claude Code セッション選択（claude --resume の fzf フロントエンド）
"github:sorafujitani/ccsession" = { version = "v1.6.0", lazy = true, lazy_bins = ["ccsession"] }

# Anthropic API CLI
"aqua:anthropics/anthropic-cli" = { version = "2.4.0", lazy = true, lazy_bins = ["ant"] }

# Language Server
"go:golang.org/x/tools/gopls" = { version = "v0.24.0", lazy = true, lazy_bins = ["gopls"] }
"github:sivchari/gopls-lazy" = { version = "v0.4.1", lazy = true, lazy_bins = ["gopls-lazy"] } # gopls を高速化する LSP プロキシ（大規模 Go モノレポ向け）
# gopls-lazy の後継。gopls に依存せず go/parser + go/types で自前に実装した LSP サーバーで、
# workspace 全体を一度だけ index してディスクに永続化するためメモリ使用量が workspace サイズに依存しない。
# gopls-lazy はまだ動くので、golance が同等に使えると確認できるまで両方入れておく。
"github:sivchari/golance" = { version = "v0.7.23", lazy = true, lazy_bins = ["golance"] }
"aqua:rust-lang/rust-analyzer" = { version = "2025-12-01", lazy = true, lazy_bins = ["rust-analyzer"] }
"aqua:tamasfe/taplo" = { version = "0.10.0", lazy = true, lazy_bins = ["taplo"] }

# その他（1password/cli は aqua CLI で管理）
"aqua:temporalio/cli" = "1.9.1"
"aqua:jdx/usage" = { version = "7.1.3", lazy = true, lazy_bins = ["usage"] }
# Datadog の AI エージェント向け CLI コンパニオン
"aqua:DataDog/pup" = "2.3.5"

# ============================================
# npm グローバルパッケージ
# ============================================
"aqua:anthropics/claude-code" = "2.1.312"
"github:google-antigravity/antigravity-cli" = { version = "1.4.9", lazy = true, lazy_bins = ["antigravity"] } # agy: Gemini CLI の後継
"aqua:openai/codex" = { version = "0.165.0", lazy = true, lazy_bins = ["codex"] }
# opencode は http backend で管理（末尾の [tools."http:opencode"] を参照）
# Grok Build CLI (xAI) は http backend で管理（末尾の [tools."http:grok"] を参照）
# Claude Code のハーネスを ChatGPT サブスクの Codex backend に向ける Anthropic 互換プロキシ。claudex から使う
"github:router-for-me/CLIProxyAPI" = "v8.0.47"
"npm:ccusage" = { version = "20.0.45", lazy = true, lazy_bins = ["ccusage"] }
"npm:@typescript/native-preview" = { version = "7.0.0-dev.20260707.2", lazy = true, lazy_bins = ["tsgo"] }
"npm:@fission-ai/openspec" = { version = "1.15.0", lazy = true, lazy_bins = ["openspec"] }
"npm:defuddle" = { version = "0.19.6", lazy = true, lazy_bins = ["defuddle"] } # WebFetch の代替: URL 本文をモデル要約を挟まず clean な Markdown で取得

# ============================================
# Grok Build CLI (xAI のターミナル向けコーディングエージェント)
# ============================================
# aqua-registry の x.ai/cli/grok は GCS 配信の http パッケージで repo_owner/repo_name を持たない。
# mise の aqua backend は lockfile 生成のたびに GitHub のタグ取得を試みて必ず失敗し、対象
# プラットフォームの数だけ警告を出す。Renovate の mise manager も aqua の http パッケージは
# 抽出対象外で更新が効かない。どちらも http backend で URL を直接指定すれば解消する。
# インラインテーブルにすると platforms を書けないため、[tools] の末尾にサブテーブルで置く。
# renovate: datasource=custom.grok-build depName=grok-build
[tools."http:grok"]
version = "1.0.70"
url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}'
bin = "grok"
lazy = true
lazy_bins = ["grok"]

# windows のアーティファクトだけ .exe が付くため個別に上書きする
[tools."http:grok".platforms]
windows-x64 = { url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe' }

# ============================================
# opencode
# ============================================
# v2 系は GitHub Release を出さずにタグだけ打ち、バイナリは opencode.ai/files/bin/<version>/ で配布している
# （anomalyco/homebrew-tap の opencode-v2.rb も同じ URL を指す）。aqua backend は Release の asset を
# 引くので v2 を入れられず、http backend で URL を直接指定する。checksum ファイルは公開されていないため、
# lockfile の checksum は fill-lockfile-checksums.sh が実アーティファクトから計算する。
# 更新は Renovate の regex manager が GitHub のタグ（v2.x）で追う。
# renovate: datasource=github-tags depName=anomalyco/opencode
[tools."http:opencode"]
version = "2.2.0"
url = 'https://opencode.ai/files/bin/{{ version }}/opencode-{{ os(macos="darwin") }}-{{ arch() }}.zip'
bin = "opencode"
lazy = true
lazy_bins = ["opencode"]

# linux のアーティファクトだけ tar.gz なので個別に上書きする
[tools."http:opencode".platforms]
linux-x64 = { url = 'https://opencode.ai/files/bin/{{ version }}/opencode-linux-x64.tar.gz' }
linux-arm64 = { url = 'https://opencode.ai/files/bin/{{ version }}/opencode-linux-arm64.tar.gz' }
