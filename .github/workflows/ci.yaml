name: CI

on:
  push:

# 書き込みは何もしないので読み取りだけにする（リポジトリ既定の権限が write でも、ここで絞る）
permissions:
  contents: read

# main 以外のブランチでは、新しい push が来たら古い run を止める。Renovate の commit に lockfile や
# bootstrap の bot commit が続くと、そのたびに 2 OS 分が走り直し、意味を持つのは最後の 1 回だけになる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 既定の 360 分だと、ツールの導入やテストが止まったときに macOS ランナーを長く占有する
    timeout-minutes: 30
    strategy:
      matrix:
        # macOS と Ubuntu の両方でテスト
        os: [ubuntu-latest, macos-latest]
    env:
      # mise/aqua の設定ファイルパスを指定
      MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/dot_config/aquaproj-aqua/aqua.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise bootstrap と同じバージョンを使用することで、task check の結果を一致させる
      - name: Read mise version from .mise-bootstrap-version
        run: |
          source .mise-bootstrap-version
          echo "MISE_VERSION=$MISE_VERSION" >> "$GITHUB_ENV"

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key: "mise-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_VERSION }}-${{ hashFiles('dot_config/mise/config.toml', 'dot_config/mise/mise.lock') }}"

      - name: Cache aqua tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dot_config/aquaproj-aqua/aqua.yaml', 'dot_config/aquaproj-aqua/aqua-checksums.json') }}
          restore-keys: |
            aqua-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install aqua tools
        run: aqua install --all

      - name: Verify installed tools
        run: |
          echo "=== Checking installed tools ==="
          mise --version
          # ランタイム
          node --version
          pnpm --version
          go version
          # 主要 CLI ツール（mise）
          gh --version
          fzf --version
          rg --version
          jq --version
          starship --version
          direnv --version
          nvim --version
          # lockfile revision 2 の依存グラフ（uv sync）で入ったものが動くか
          snow --version
          # CLI ツール（aqua）
          export PATH="${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua/bin:$PATH"
          aws --version
          op --version
          zoxide --version

      # mise の python は snowflake-cli の install 用に置いているだけで、shims には出さない
      # （dot_config/mise/config.toml の shims.exclude）。python の bin にあるコマンド名が
      # shims に残っていないかを突き合わせる。名前が足りなければ、漏れた名前を出して落ちる。
      - name: Verify python is not exposed via shims
        run: |
          python_bin="$(mise where python)/bin"
          shims_dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims"
          if [ ! -d "$python_bin" ] || [ ! -d "$shims_dir" ]; then
            echo "Error: 検査対象のディレクトリがありません: $python_bin / $shims_dir"
            exit 1
          fi
          echo "=== $python_bin ==="
          ls "$python_bin"
          leaked=""
          for f in "$python_bin"/*; do
            name=$(basename "$f")
            if [ -e "$shims_dir/$name" ] || [ -L "$shims_dir/$name" ]; then
              leaked="$leaked $name"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "Error: python のコマンドが shims に出ています:$leaked"
            echo "dot_config/mise/config.toml の shims.exclude に追加してください。"
            exit 1
          fi
          echo "python のコマンドは shims に出ていません。"

      - name: Go test & build
        run: |
          go test ./go/...
          go build ./go/...

      # Go の静的解析。設定は .golangci.yml。結果は OS に依存しないので Ubuntu だけで実行する
      - name: Lint Go
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l go)"
          if [ -n "$unformatted" ]; then
            echo "Error: gofmt されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi
          golangci-lint run ./go/...

      # シェルスクリプトと workflow の静的解析。run_ スクリプトはテンプレートで OS ごとに中身が変わるので、
      # 両 OS で描画した結果を検査する。actionlint は workflow の run: も shellcheck にかける
      - name: Lint shell scripts and workflows
        run: |
          shellcheck .github/scripts/*.sh install.sh \
            dot_local/bin/executable_snowx dot_local/bin/executable_codex-review-exec dot_local/bin/executable_gtts
          rendered="$RUNNER_TEMP/rendered"
          mkdir -p "$rendered"
          for f in run_*.sh.tmpl; do
            chezmoi --source . execute-template < "$f" > "$rendered/${f%.tmpl}"
          done
          shellcheck "$rendered"/*.sh
          actionlint

      # zsh の関数ファイルの構文。Ubuntu のランナーには zsh が入っていないので macOS だけで実行する
      - name: Check zsh syntax
        if: matrix.os == 'macos-latest'
        run: |
          for f in dot_zsh/functions/*.zsh; do
            zsh -n "$f"
          done

      # Jsonnet ソースファイルの構文チェック
      # 構文エラーがあればビルドを失敗させる（Requirement 4.2, 4.3）
      - name: Check Jsonnet syntax
        run: |
          echo "=== Checking Jsonnet syntax ==="
          find dot_claude dot_codex dot_gemini -name '*.jsonnet' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f..."
            jsonnet "$f" > /dev/null
          done
          echo "All Jsonnet files are valid."

      # 自動生成ファイルの diff チェック
      # - jsonnet, aqua-checksums, mise bootstrap が最新かどうかを検証
      # - mise.lock は実行環境（macOS/Linux）で結果が異なる既知の問題があるため除外
      #   参考: https://github.com/jdx/mise/discussions/6942
      # - Ubuntu のみで実行（両 OS で実行しても同じ結果になるため）
      - name: Check generated files are up-to-date
        if: matrix.os == 'ubuntu-latest'
        run: task check

      - name: Setup chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            sh -c "$(curl -fsLS chezmoi.io/get)" -- -b /usr/local/bin
          fi

      - name: Verify chezmoi templates
        run: |
          chezmoi --source . --dry-run --verbose apply

      # リポジトリ専用のファイル（文書・jsonnet のソース・Go のソース等）が配布対象に入っていないか。
      # .chezmoiignore は配布先のパスに照合するので、ソース側のパスで書くと黙って効かずに配布される。
      # 配布先で読むもの（~/.claude/CLAUDE.md、ccgate の jsonnet 等）は除外リストで許す。
      - name: Verify repository-only files are not distributed
        run: |
          managed="$(chezmoi --source . --destination "$RUNNER_TEMP/chezmoi-home" managed --include files,symlinks)"
          leaked="$(printf '%s\n' "$managed" \
            | grep -E '(^|/)(CLAUDE\.md|AGENTS\.md|README\.md|REVIEW\.md|LICENSE|install\.sh|Taskfile\.yaml|go\.(mod|sum))$|\.(jsonnet|libsonnet)$|^(go|claude-plugins)/' \
            | grep -v -x -E '\.claude/CLAUDE\.md|\.codex/AGENTS\.md|\.config/tmux/README\.md|\.claude/ccgate\.jsonnet|\.codex/ccgate\.jsonnet|ccgate\.libsonnet' \
            || true)"
          if [ -n "$leaked" ]; then
            echo "Error: リポジトリ専用のファイルが配布対象に入っています。.chezmoiignore に配布先のパスで追加してください:"
            echo "$leaked"
            exit 1
          fi
          echo "リポジトリ専用のファイルは配布対象に入っていません。"

      # marketplace.json と各プラグインの manifest を検証する。version を書かない方針
      # （CLAUDE.md「Claude Code カスタムマーケットプレイス」）と icon 等の提出向けの warning があるので、
      # --strict は付けずエラーだけで落とす。結果は OS に依存しないので Ubuntu だけで実行する。
      - name: Validate Claude Code plugins
        if: matrix.os == 'ubuntu-latest'
        run: |
          claude plugin validate .
          for dir in claude-plugins/*/; do
            claude plugin validate "$dir"
          done
