name: CI

on:
  push:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS と Ubuntu の両方でテスト
        os: [ubuntu-latest, macos-latest]
    env:
      # mise/aqua の設定ファイルパスを指定
      MISE_CONFIG_FILE: ${{ github.workspace }}/dot_config/mise/config.toml
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/dot_config/aquaproj-aqua/aqua.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise bootstrap と同じバージョンを使用することで、task check の結果を一致させる
      - name: Read mise version from .mise-bootstrap-version
        run: |
          source .mise-bootstrap-version
          echo "MISE_VERSION=$MISE_VERSION" >> $GITHUB_ENV

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key: "mise-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_VERSION }}-${{ hashFiles('dot_config/mise/config.toml', 'dot_config/mise/mise.lock') }}"

      - name: Cache aqua tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dot_config/aquaproj-aqua/aqua.yaml', 'dot_config/aquaproj-aqua/aqua-checksums.json') }}
          restore-keys: |
            aqua-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install aqua tools
        run: aqua install --all

      - name: Verify installed tools
        run: |
          echo "=== Checking installed tools ==="
          mise --version
          # ランタイム
          node --version
          pnpm --version
          go version
          # 主要 CLI ツール（mise）
          gh --version
          fzf --version
          rg --version
          jq --version
          starship --version
          direnv --version
          nvim --version
          # lockfile revision 2 の依存グラフ（uv sync）で入ったものが動くか
          snow --version
          # CLI ツール（aqua）
          export PATH="${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua/bin:$PATH"
          aws --version
          op --version
          zoxide --version

      # mise の python は snowflake-cli の install 用に置いているだけで、shims には出さない
      # （dot_config/mise/config.toml の shims.exclude）。python の bin にあるコマンド名が
      # shims に残っていないかを突き合わせる。名前が足りなければ、漏れた名前を出して落ちる。
      - name: Verify python is not exposed via shims
        run: |
          python_bin="$(mise where python)/bin"
          shims_dir="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/shims"
          if [ ! -d "$python_bin" ] || [ ! -d "$shims_dir" ]; then
            echo "Error: 検査対象のディレクトリがありません: $python_bin / $shims_dir"
            exit 1
          fi
          echo "=== $python_bin ==="
          ls "$python_bin"
          leaked=""
          for f in "$python_bin"/*; do
            name=$(basename "$f")
            if [ -e "$shims_dir/$name" ] || [ -L "$shims_dir/$name" ]; then
              leaked="$leaked $name"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "Error: python のコマンドが shims に出ています:$leaked"
            echo "dot_config/mise/config.toml の shims.exclude に追加してください。"
            exit 1
          fi
          echo "python のコマンドは shims に出ていません。"

      - name: Go test & build
        run: |
          go test ./go/...
          go build ./go/...

      # Jsonnet ソースファイルの構文チェック
      # 構文エラーがあればビルドを失敗させる（Requirement 4.2, 4.3）
      - name: Check Jsonnet syntax
        run: |
          echo "=== Checking Jsonnet syntax ==="
          for f in $(find dot_claude dot_gemini -name '*.jsonnet'); do
            echo "Checking $f..."
            jsonnet "$f" > /dev/null || exit 1
          done
          echo "All Jsonnet files are valid."

      # 自動生成ファイルの diff チェック
      # - jsonnet, aqua-checksums, mise bootstrap が最新かどうかを検証
      # - mise.lock は実行環境（macOS/Linux）で結果が異なる既知の問題があるため除外
      #   参考: https://github.com/jdx/mise/discussions/6942
      # - Ubuntu のみで実行（両 OS で実行しても同じ結果になるため）
      - name: Check generated files are up-to-date
        if: matrix.os == 'ubuntu-latest'
        run: task check

      - name: Setup chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            sh -c "$(curl -fsLS chezmoi.io/get)" -- -b /usr/local/bin
          fi

      - name: Verify chezmoi templates
        run: |
          chezmoi --source . --dry-run --verbose apply
