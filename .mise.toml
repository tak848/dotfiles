[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_install = false
experimental = true
lockfile = true
locked = false                                 # npm backend が checksum 未対応のため

[env]
# aube (mise の npm backend が内部で使う) の trustPolicy=no-downgrade が
# tinyexec@1.2.2 を拒否するため、このバージョンだけ exclude。
# 詳細は dot_config/mise/config.toml の [env] コメント参照。
NPM_CONFIG_TRUST_POLICY_EXCLUDE = "tinyexec@1.2.2"

[tools]
# このリポジトリで使うランタイム
node = "26.13.0"
pnpm = "12.18.0"

# このリポジトリで使う CLI ツール
"aqua:google/go-jsonnet" = "0.22.0"
"aqua:go-task/task" = "3.54.0"
# ci.yaml の lint で使う（actionlint は workflow の run: を shellcheck にかける）
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
# .github/workflows/actions.lock の生成と ci.yaml の検証で使う。gh の extension（gh extension install）ではなく
# mise で入れて、mise.lock に checksum と provenance を残す。単体の実行ファイルとして gh-actions-lock で呼ぶ。
# asset 名が darwin-arm64 のような OS 名だけなので、bin で名前を付ける（付けないと darwin / linux になる）
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }

# install.sh からの bootstrap で使う。dot_config/mise/config.toml と揃える
"aqua:twpayne/chezmoi" = "2.74.0"

# lazy-lock.yaml ワークフローで使用
"aqua:neovim/neovim" = "0.12.6"
